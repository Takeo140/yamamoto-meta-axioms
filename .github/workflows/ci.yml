name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lean 4 formal verification ────────────────────────────────────────────
  verify-lean:
    name: Lean 4 Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -sSf | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: elan-

      - name: Cache Lake build & dependencies
        uses: actions/cache@v4
        with:
          path: |
            .lake
            lean_packages
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lakefile.toml') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lakefile.toml') }}-

      - name: Get Mathlib cache (if applicable)
        run: |
          if [ -f "lakefile.lean" ] && grep -q "mathlib" lakefile.lean; then
            lake exe cache get || true
          fi

      - name: Build and verify Lean proofs
        run: lake build

      - name: Check no sorry
        run: |
          if grep -rn "\bsorry\b" --include="*.lean" .; then
            echo "::error::sorry found — proofs incomplete"
            exit 1
          fi

  # ── C++ / CUDA verification ─────────────────────────────────────────────
  verify-cpp-cuda:
    name: C++ / CUDA Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake & Build Environment
        uses: lukka/get-cmake@latest

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/*.cpp', '**/*.cu', '**/*.h') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Configure and Build (C++ / CUDA)
        run: |
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j$(nproc)
          else
            echo "No CMakeLists.txt found, skipping C++/CUDA build step."
          fi

      - name: Run C++ / CUDA Tests
        run: |
          if [ -d "build" ] && [ -f "build/CTestTestfile.cmake" ]; then
            cd build
            ctest --output-on-failure
          fi

  # ── Python logic verification ─────────────────────────────────────────────
  verify-python:
    name: Python Logic Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Run integration tests
        run: |
          if [ -f "verify_42.py" ]; then
            python verify_42.py
          elif command -v pytest &> /dev/null; then
            pytest
          else
            echo "No test runner script found (verify_42.py or pytest)."
          fi

  # ── Final gate: all must pass ────────────────────────────────────────────
  all-verified:
    name: All Verified
    needs: [verify-lean, verify-cpp-cuda, verify-python]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.verify-lean.result }}" != "success" || \
                "${{ needs.verify-cpp-cuda.result }}" != "success" || \
                "${{ needs.verify-python.result }}" != "success" ]]; then
            echo "::error::One or more verification jobs failed"
            exit 1
          fi
          echo "Lean 4 + C++/CUDA + Python verification passed successfully."

